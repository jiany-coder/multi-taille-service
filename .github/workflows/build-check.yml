name: build-check
on:
  push:
    branches: [seo-60-articles, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --frozen-lockfile || yarn install
      - run: yarn build
        env:
          CI: "false"
          REACT_APP_SITE_URL: https://multi-taille-services.online
      - run: test -f build/sitemap.xml && grep -c "<loc>" build/sitemap.xml
      - run: ls build/conseils | wc -l
